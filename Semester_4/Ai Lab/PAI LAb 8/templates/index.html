<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Streaming App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-900 text-white">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-900 to-indigo-900 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-3xl font-bold flex items-center">
                    <i class="fas fa-film mr-3 text-yellow-400"></i>
                    Movie Stream
                </h1>
                <div class="flex items-center space-x-4">
                    <button onclick="loadTopMovies()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>Home
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <section class="bg-gradient-to-b from-indigo-900 to-gray-900 py-12">
        <div class="container mx-auto px-4">
            <div class="max-w-2xl mx-auto">
                <div class="search-container bg-gray-800 bg-opacity-50 rounded-lg p-6 shadow-xl">
                    <h2 class="text-2xl font-bold mb-4 text-center">Search Movies</h2>
                    <div class="flex gap-3">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search for movies..." 
                            class="flex-1 px-4 py-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                            onkeypress="handleSearchKeyPress(event)"
                        >
                        <button 
                            onclick="searchMovies()" 
                            class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-semibold transition flex items-center"
                        >
                            <i class="fas fa-search mr-2"></i>Search
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Movies Section -->
    <section class="container mx-auto px-4 py-8">
        <div id="sectionTitle" class="text-3xl font-bold mb-6 flex items-center">
            <i class="fas fa-fire text-orange-500 mr-3"></i>
            Top 10 Popular Movies
        </div>
        
        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="flex justify-center items-center py-20 hidden">
            <div class="loading"></div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-900 bg-opacity-50 border border-red-500 rounded-lg p-4 mb-6">
            <p class="text-center text-red-200"></p>
        </div>

        <!-- Movies Grid -->
        <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- Movies will be loaded here -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-film text-6xl text-gray-600 mb-4"></i>
            <p class="text-xl text-gray-400">No movies found</p>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
